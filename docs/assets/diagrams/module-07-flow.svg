<svg xmlns="http://www.w3.org/2000/svg" width="860" height="150" viewBox="0 0 860 150" role="img" aria-labelledby="t d"><title id="t">Module 7 agent governance toolkit flow</title><desc id="d">Agent specification flows through AGT policy to a posture decision.</desc><style>.bg{fill:#f8fafc}.box{fill:#e0f2fe;stroke:#0284c7;stroke-width:2;rx:8}.gov{fill:#f5f3ff;stroke:#7c3aed;stroke-width:2;rx:8}.ok{fill:#ecfdf5;stroke:#059669;stroke-width:2;rx:8}.txt{font:600 16px Segoe UI,Arial;fill:#0f172a}.sub{font:500 12px Segoe UI,Arial;fill:#475569}.arr{stroke:#475569;stroke-width:2.3;marker-end:url(#a)}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0l10 5-10 5z" fill="#475569"/></marker></defs><rect class="bg" width="860" height="150" rx="10"/><text class="txt" x="24" y="32">Module 7 - Agent Governance Toolkit</text><rect class="box" x="42" y="64" width="170" height="52"/><text class="txt" x="82" y="88">Agent spec</text><text class="sub" x="66" y="106">agents, prompts, tools</text><line class="arr" x1="212" y1="90" x2="304" y2="90"/><rect class="gov" x="314" y="64" width="190" height="52"/><text class="txt" x="364" y="88">AGT policy</text><text class="sub" x="342" y="106">rules and default deny</text><line class="arr" x1="504" y1="90" x2="596" y2="90"/><rect class="ok" x="606" y="64" width="210" height="52"/><text class="txt" x="650" y="88">Posture decision</text><text class="sub" x="640" y="106">CI gate pass or fail</text></svg>