<svg xmlns="http://www.w3.org/2000/svg" width="860" height="150" viewBox="0 0 860 150" role="img" aria-labelledby="t d"><title id="t">Module 8 data poisoning and groundedness flow</title><desc id="d">Retrieved documents flow through groundedness checks before source-backed answers.</desc><style>.bg{fill:#f8fafc}.box{fill:#fef3c7;stroke:#d97706;stroke-width:2;rx:8}.guard{fill:#e0f2fe;stroke:#0284c7;stroke-width:2;rx:8}.ok{fill:#ecfdf5;stroke:#059669;stroke-width:2;rx:8}.txt{font:600 16px Segoe UI,Arial;fill:#0f172a}.sub{font:500 12px Segoe UI,Arial;fill:#475569}.arr{stroke:#475569;stroke-width:2.3;marker-end:url(#a)}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0l10 5-10 5z" fill="#475569"/></marker></defs><rect class="bg" width="860" height="150" rx="10"/><text class="txt" x="24" y="32">Module 8 - Poisoning and Groundedness</text><rect class="box" x="42" y="64" width="174" height="52"/><text class="txt" x="84" y="88">Retrieved doc</text><text class="sub" x="68" y="106">clean or poisoned source</text><line class="arr" x1="216" y1="90" x2="306" y2="90"/><rect class="guard" x="316" y="64" width="188" height="52"/><text class="txt" x="354" y="88">Groundedness</text><text class="sub" x="344" y="106">support check over sources</text><line class="arr" x1="504" y1="90" x2="596" y2="90"/><rect class="ok" x="606" y="64" width="216" height="52"/><text class="txt" x="652" y="88">Source-backed answer</text><text class="sub" x="644" y="106">refuse or correct drift</text></svg>