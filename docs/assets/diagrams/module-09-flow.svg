<svg xmlns="http://www.w3.org/2000/svg" width="860" height="150" viewBox="0 0 860 150" role="img" aria-labelledby="t d"><title id="t">Module 9 evaluations flow</title><desc id="d">Attack set flows through evaluation runner to pass fail metrics.</desc><style>.bg{fill:#f8fafc}.box{fill:#e0f2fe;stroke:#0284c7;stroke-width:2;rx:8}.eval{fill:#f5f3ff;stroke:#7c3aed;stroke-width:2;rx:8}.ok{fill:#ecfdf5;stroke:#059669;stroke-width:2;rx:8}.txt{font:600 16px Segoe UI,Arial;fill:#0f172a}.sub{font:500 12px Segoe UI,Arial;fill:#475569}.arr{stroke:#475569;stroke-width:2.3;marker-end:url(#a)}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0l10 5-10 5z" fill="#475569"/></marker></defs><rect class="bg" width="860" height="150" rx="10"/><text class="txt" x="24" y="32">Module 9 - Evaluations</text><rect class="box" x="42" y="64" width="170" height="52"/><text class="txt" x="86" y="88">Attack set</text><text class="sub" x="72" y="106">safety and agentic probes</text><line class="arr" x1="212" y1="90" x2="304" y2="90"/><rect class="eval" x="314" y="64" width="190" height="52"/><text class="txt" x="352" y="88">Eval runner</text><text class="sub" x="344" y="106">local and Foundry evals</text><line class="arr" x1="504" y1="90" x2="596" y2="90"/><rect class="ok" x="606" y="64" width="210" height="52"/><text class="txt" x="654" y="88">Scorecard</text><text class="sub" x="646" y="106">pass/fail regression gate</text></svg>