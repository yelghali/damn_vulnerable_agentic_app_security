<svg xmlns="http://www.w3.org/2000/svg" width="860" height="150" viewBox="0 0 860 150" role="img" aria-labelledby="t d"><title id="t">Module 6 APIM and Defender flow</title><desc id="d">Browser and API traffic flows through APIM gateway to Monitor and Defender controls.</desc><style>.bg{fill:#f8fafc}.box{fill:#e0f2fe;stroke:#0284c7;stroke-width:2;rx:8}.gw{fill:#f5f3ff;stroke:#7c3aed;stroke-width:2;rx:8}.ok{fill:#ecfdf5;stroke:#059669;stroke-width:2;rx:8}.txt{font:600 16px Segoe UI,Arial;fill:#0f172a}.sub{font:500 12px Segoe UI,Arial;fill:#475569}.arr{stroke:#475569;stroke-width:2.3;marker-end:url(#a)}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0l10 5-10 5z" fill="#475569"/></marker></defs><rect class="bg" width="860" height="150" rx="10"/><text class="txt" x="24" y="32">Module 6 - APIM Gateway, Observability, Defender</text><rect class="box" x="42" y="64" width="160" height="52"/><text class="txt" x="82" y="88">Browser/API</text><text class="sub" x="70" y="106">model and tool calls</text><line class="arr" x1="202" y1="90" x2="292" y2="90"/><rect class="gw" x="302" y="64" width="180" height="52"/><text class="txt" x="348" y="88">APIM</text><text class="sub" x="326" y="106">auth, keys, token limits</text><line class="arr" x1="482" y1="90" x2="572" y2="90"/><rect class="ok" x="582" y="64" width="230" height="52"/><text class="txt" x="630" y="88">Monitor/Defender</text><text class="sub" x="618" y="106">logs and threat detection</text></svg>