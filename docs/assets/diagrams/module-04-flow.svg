<svg xmlns="http://www.w3.org/2000/svg" width="920" height="210" viewBox="0 0 920 210" role="img" aria-labelledby="t d"><title id="t">Module 4 secure tool boundary flow</title><desc id="d">Foundry agent actions are routed through deterministic guards before MCP tools, PostgreSQL row level security, human approval, and sandboxed code execution.</desc><style>.bg{fill:#f8fafc}.agent{fill:#e0f2fe;stroke:#0284c7;stroke-width:2;rx:8}.gate{fill:#f5f3ff;stroke:#7c3aed;stroke-width:2;rx:8}.data{fill:#ecfdf5;stroke:#059669;stroke-width:2;rx:8}.risk{fill:#fef3c7;stroke:#d97706;stroke-width:2;rx:8}.txt{font:600 15px Segoe UI,Arial;fill:#0f172a}.sub{font:500 11px Segoe UI,Arial;fill:#475569}.arr{stroke:#475569;stroke-width:2.2;marker-end:url(#a)}.thin{stroke:#94a3b8;stroke-width:1.7;marker-end:url(#a)}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0l10 5-10 5z" fill="#475569"/></marker></defs><rect class="bg" width="920" height="210" rx="10"/><text class="txt" x="24" y="30">Module 4 - Secure MCP, least privilege, HITL, and code execution</text><rect class="agent" x="34" y="76" width="150" height="58"/><text class="txt" x="71" y="99">Foundry agent</text><text class="sub" x="57" y="118">read, transfer, report</text><line class="arr" x1="184" y1="105" x2="246" y2="105"/><rect class="gate" x="256" y="76" width="176" height="58"/><text class="txt" x="292" y="99">Tool policy gate</text><text class="sub" x="276" y="118">allow-list + authZ + scan</text><line class="arr" x1="432" y1="105" x2="496" y2="105"/><rect class="data" x="506" y="48" width="170" height="48"/><text class="txt" x="546" y="70">Postgres MCP</text><text class="sub" x="531" y="87">approved server only</text><line class="thin" x1="676" y1="72" x2="748" y2="72"/><rect class="data" x="758" y="48" width="128" height="48"/><text class="txt" x="798" y="70">RLS</text><text class="sub" x="778" y="87">user rows only</text><line class="thin" x1="432" y1="105" x2="496" y2="154"/><rect class="risk" x="506" y="130" width="170" height="48"/><text class="txt" x="541" y="152">HITL approval</text><text class="sub" x="529" y="169">state-changing tools</text><line class="thin" x1="676" y1="154" x2="748" y2="154"/><rect class="risk" x="758" y="130" width="128" height="48"/><text class="txt" x="782" y="152">Sandbox</text><text class="sub" x="779" y="169">report code only</text></svg>