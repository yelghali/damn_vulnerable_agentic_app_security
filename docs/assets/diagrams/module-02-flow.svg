<svg xmlns="http://www.w3.org/2000/svg" width="860" height="150" viewBox="0 0 860 150" role="img" aria-labelledby="t d"><title id="t">Module 2 Prompt Shields flow</title><desc id="d">User prompt or RAG chunk flows through ShieldPrompt before entering agent context.</desc><style>.bg{fill:#f8fafc}.box{fill:#fef3c7;stroke:#d97706;stroke-width:2;rx:8}.shield{fill:#e0f2fe;stroke:#0284c7;stroke-width:2;rx:8}.ok{fill:#ecfdf5;stroke:#059669;stroke-width:2;rx:8}.txt{font:600 16px Segoe UI,Arial;fill:#0f172a}.sub{font:500 12px Segoe UI,Arial;fill:#475569}.arr{stroke:#475569;stroke-width:2.3;marker-end:url(#a)}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0l10 5-10 5z" fill="#475569"/></marker></defs><rect class="bg" width="860" height="150" rx="10"/><text class="txt" x="24" y="32">Module 2 - Prompt Shields</text><rect class="box" x="42" y="64" width="190" height="52"/><text class="txt" x="72" y="88">User or RAG text</text><text class="sub" x="64" y="106">direct or indirect injection</text><line class="arr" x1="232" y1="90" x2="322" y2="90"/><rect class="shield" x="332" y="64" width="178" height="52"/><text class="txt" x="370" y="88">ShieldPrompt</text><text class="sub" x="356" y="106">blocks injected instructions</text><line class="arr" x1="510" y1="90" x2="602" y2="90"/><rect class="ok" x="612" y="64" width="198" height="52"/><text class="txt" x="660" y="88">Agent context</text><text class="sub" x="648" y="106">trusted prompt assembly</text></svg>