<svg xmlns="http://www.w3.org/2000/svg" width="860" height="150" viewBox="0 0 860 150" role="img" aria-labelledby="t d"><title id="t">Module 1 Responsible and Safe AI flow</title><desc id="d">User prompt flows through Foundry RAI policy to a governed model.</desc><style>.bg{fill:#f8fafc}.box{fill:#e0f2fe;stroke:#0284c7;stroke-width:2;rx:8}.ok{fill:#ecfdf5;stroke:#059669;stroke-width:2;rx:8}.txt{font:600 16px Segoe UI,Arial;fill:#0f172a}.sub{font:500 12px Segoe UI,Arial;fill:#475569}.arr{stroke:#475569;stroke-width:2.3;marker-end:url(#a)}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0l10 5-10 5z" fill="#475569"/></marker></defs><rect class="bg" width="860" height="150" rx="10"/><text class="txt" x="24" y="32">Module 1 - Responsible and Safe AI</text><rect class="box" x="42" y="64" width="170" height="52"/><text class="txt" x="76" y="88">User prompt</text><text class="sub" x="68" y="106">harm/off-topic input</text><line class="arr" x1="212" y1="90" x2="305" y2="90"/><rect class="box" x="315" y="64" width="190" height="52"/><text class="txt" x="350" y="88">Foundry RAI</text><text class="sub" x="344" y="106">content filters + policy</text><line class="arr" x1="505" y1="90" x2="600" y2="90"/><rect class="ok" x="610" y="64" width="198" height="52"/><text class="txt" x="652" y="88">Governed model</text><text class="sub" x="644" y="106">safe input and output</text></svg>