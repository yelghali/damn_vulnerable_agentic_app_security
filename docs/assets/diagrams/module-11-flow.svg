<svg xmlns="http://www.w3.org/2000/svg" width="860" height="150" viewBox="0 0 860 150" role="img" aria-labelledby="t d"><title id="t">Module 11 AI red teaming flow</title><desc id="d">Adversarial prompts flow through the red-team runner to remediation findings.</desc><style>.bg{fill:#f8fafc}.box{fill:#fee2e2;stroke:#dc2626;stroke-width:2;rx:8}.run{fill:#f5f3ff;stroke:#7c3aed;stroke-width:2;rx:8}.ok{fill:#ecfdf5;stroke:#059669;stroke-width:2;rx:8}.txt{font:600 16px Segoe UI,Arial;fill:#0f172a}.sub{font:500 12px Segoe UI,Arial;fill:#475569}.arr{stroke:#475569;stroke-width:2.3;marker-end:url(#a)}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0l10 5-10 5z" fill="#475569"/></marker></defs><rect class="bg" width="860" height="150" rx="10"/><text class="txt" x="24" y="32">Module 11 - AI Red Teaming</text><rect class="box" x="42" y="64" width="190" height="52"/><text class="txt" x="80" y="88">Adversarial prompts</text><text class="sub" x="76" y="106">jailbreaks, IDOR, tool abuse</text><line class="arr" x1="232" y1="90" x2="322" y2="90"/><rect class="run" x="332" y="64" width="178" height="52"/><text class="txt" x="370" y="88">Red-team run</text><text class="sub" x="360" y="106">automated attack sweep</text><line class="arr" x1="510" y1="90" x2="602" y2="90"/><rect class="ok" x="612" y="64" width="198" height="52"/><text class="txt" x="652" y="88">Remediation list</text><text class="sub" x="648" y="106">fix and rerun gate</text></svg>