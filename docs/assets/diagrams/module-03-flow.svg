<svg xmlns="http://www.w3.org/2000/svg" width="860" height="150" viewBox="0 0 860 150" role="img" aria-labelledby="t d"><title id="t">Module 3 PII protection flow</title><desc id="d">Tool output flows through Azure AI Language PII redaction before logs and responses.</desc><style>.bg{fill:#f8fafc}.box{fill:#fef3c7;stroke:#d97706;stroke-width:2;rx:8}.guard{fill:#e0f2fe;stroke:#0284c7;stroke-width:2;rx:8}.ok{fill:#ecfdf5;stroke:#059669;stroke-width:2;rx:8}.txt{font:600 16px Segoe UI,Arial;fill:#0f172a}.sub{font:500 12px Segoe UI,Arial;fill:#475569}.arr{stroke:#475569;stroke-width:2.3;marker-end:url(#a)}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0l10 5-10 5z" fill="#475569"/></marker></defs><rect class="bg" width="860" height="150" rx="10"/><text class="txt" x="24" y="32">Module 3 - PII Protection</text><rect class="box" x="42" y="64" width="170" height="52"/><text class="txt" x="84" y="88">Tool output</text><text class="sub" x="66" y="106">SSN/account data</text><line class="arr" x1="212" y1="90" x2="304" y2="90"/><rect class="guard" x="314" y="64" width="210" height="52"/><text class="txt" x="356" y="88">AI Language PII</text><text class="sub" x="350" y="106">detect and redact entities</text><line class="arr" x1="524" y1="90" x2="616" y2="90"/><rect class="ok" x="626" y="64" width="190" height="52"/><text class="txt" x="674" y="88">Safe text</text><text class="sub" x="654" y="106">redacted reply and logs</text></svg>