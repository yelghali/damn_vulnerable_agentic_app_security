<svg xmlns="http://www.w3.org/2000/svg" width="860" height="150" viewBox="0 0 860 150" role="img" aria-labelledby="t d"><title id="t">Module 5 Entra and Search security flow</title><desc id="d">Signed user identity flows through Entra OBO to AI Search ACL trimming.</desc><style>.bg{fill:#f8fafc}.box{fill:#e0f2fe;stroke:#0284c7;stroke-width:2;rx:8}.id{fill:#f5f3ff;stroke:#7c3aed;stroke-width:2;rx:8}.data{fill:#ecfdf5;stroke:#059669;stroke-width:2;rx:8}.txt{font:600 16px Segoe UI,Arial;fill:#0f172a}.sub{font:500 12px Segoe UI,Arial;fill:#475569}.arr{stroke:#475569;stroke-width:2.3;marker-end:url(#a)}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0l10 5-10 5z" fill="#475569"/></marker></defs><rect class="bg" width="860" height="150" rx="10"/><text class="txt" x="24" y="32">Module 5 - Entra and AI Search Security</text><rect class="box" x="42" y="64" width="160" height="52"/><text class="txt" x="82" y="88">Signed user</text><text class="sub" x="72" y="106">validated token</text><line class="arr" x1="202" y1="90" x2="292" y2="90"/><rect class="id" x="302" y="64" width="168" height="52"/><text class="txt" x="340" y="88">Entra OBO</text><text class="sub" x="324" y="106">downstream user token</text><line class="arr" x1="470" y1="90" x2="560" y2="90"/><rect class="data" x="570" y="64" width="238" height="52"/><text class="txt" x="622" y="88">AI Search ACL</text><text class="sub" x="604" y="106">group_ids security trimming</text></svg>