<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Zava Wealth Advisor</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; background: #0f1115; color: #e8e8e8; }
    header { padding: 12px 20px; background: #1a1d24; border-bottom: 1px solid #2a2e37; }
    header h1 { font-size: 16px; margin: 0; }
    #banner { font-size: 12px; color: #9aa0aa; margin-top: 6px; }
    #banner .on { color: #4ade80; }
    #banner .off { color: #f87171; }
    main { max-width: 840px; margin: 0 auto; padding: 16px; }
    #log { min-height: 320px; }
    .msg { padding: 10px 14px; border-radius: 10px; margin: 8px 0; white-space: pre-wrap; }
    .user { background: #243047; align-self: flex-end; }
    .bot { background: #1d2129; }
    .events { font-size: 11px; color: #8b93a0; border-left: 2px solid #3a4150; padding-left: 8px; margin: 4px 0 12px; }
    .blocked { border-left: 3px solid #f87171; }
    form { display: flex; gap: 8px; margin-top: 12px; }
    input[type=text] { flex: 1; padding: 10px; border-radius: 8px; border: 1px solid #2a2e37; background: #14171d; color: #e8e8e8; }
    button { padding: 10px 16px; border: 0; border-radius: 8px; background: #3b82f6; color: white; cursor: pointer; }
    .controls { font-size: 12px; color: #9aa0aa; margin-bottom: 8px; }
    .controls input { width: 120px; }
    #approval { background: #3a2e12; border: 1px solid #c08a2a; padding: 8px 12px; border-radius: 8px; margin-top: 8px; display: none; }
  </style>
</head>
<body>
  <header>
    <h1>Zava Wealth Advisor &mdash; <span style="color:#f87171">Damn Vulnerable Agentic App</span></h1>
    <div id="banner">loading security posture&hellip;</div>
  </header>
  <main>
    <div class="controls">
      Signed-in customer:
      <input id="customer" type="text" value="CUST-1001" />
      groups:
      <input id="groups" type="text" value="retail-customers" />
    </div>
    <div id="log"></div>
    <div id="approval">
      <span id="approval-text"></span>
      <button id="approve-btn">Approve</button>
    </div>
    <form id="form">
      <input id="input" type="text" autocomplete="off"
             placeholder="Ask about your accounts, transactions, documents&hellip;" />
      <button type="submit">Send</button>
    </form>
  </main>
  <script src="/static/app.js"></script>
</body>
</html>
